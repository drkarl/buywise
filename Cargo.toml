[workspace]
members = [
    "crates/api",
    "crates/core",
    "crates/ingest",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Internal crates
buywise-core = { path = "crates/core" }
buywise-ingest = { path = "crates/ingest" }

# Shared third-party dependencies (versions pinned here for consistency)
# Minimal feature set: no TLS driver (local SQLite only). `migrate` is enabled
# for `sqlx::migrate!` / `sqlx::migrate::Migrator` (used from P0-T2 onward).
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
strsim = "0.11"
unicode-normalization = "0.1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
# Minimal feature set: drops default http2 and gzip/brotli decompression. Re-add
# (`http2`, `gzip`, …) if the ingest adapters need them.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
argon2 = "0.5"
# Pinned to 0.8 (rand_core 0.6) to match argon2 0.5 / password-hash 0.5, whose
# `SaltString::generate` expects a rand_core 0.6 RNG. Bumping to rand 0.9 would
# pull a second rand_core (0.9) and break the api crate's password hashing.
rand = "0.8"
