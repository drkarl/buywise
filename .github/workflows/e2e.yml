# Playwright end-to-end suite for the P2-T4 client sync loop (issue #63).
#
# This workflow complements `.github/workflows/ci.yml` with browser-level
# coverage. It builds the Rust backend (which serves BOTH the JSON API and the
# built SPA on one origin), builds the SvelteKit SPA, installs the Playwright
# browser, and runs the two-context offline/reconnect sync specs.
# `e2e/run-server.sh` (the Playwright `webServer`) boots the release
# `buywise-api` on a fresh SQLite file, lets it migrate, and seeds a user +
# household + list (the backend has no
# register endpoint — see e2e/seed.sh), so no separate DB service is needed.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # --- Rust backend ---------------------------------------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build backend (api + cli) in release
        working-directory: .
        # The release `buywise-api` serves the SPA + API; `buywise-cli
        # set-password` seeds the user's argon2 hash. Both are what
        # e2e/run-server.sh + e2e/seed.sh invoke.
        run: cargo build --release -p buywise-api -p buywise-cli

      # --- Frontend + Playwright -----------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the SPA
        # The backend serves frontend/build via ServeDir; the e2e drives that
        # production build, not a Vite dev server.
        run: npm run build

      - name: Install Playwright browser (chromium) + system deps
        run: npx playwright install --with-deps chromium

      - name: Ensure sqlite3 is available (seed script uses it)
        working-directory: .
        # ubuntu-latest ships sqlite3, but install it defensively if absent.
        run: |
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y sqlite3
          fi
          sqlite3 --version

      - name: Run e2e suite
        env:
          CI: 'true'
        run: npm run test:e2e

      # --- Artifacts on failure ------------------------------------------
      - name: Upload Playwright report
        # Only on failure: this section is for debugging a failed run, matching
        # the sibling traces/screenshots step. (A green run needs no report.)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload traces / screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
