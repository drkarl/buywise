[package]
name = "buywise-api"
version.workspace = true
edition.workspace = true

[dependencies]
buywise-core = { workspace = true }
buywise-ingest = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tower-http = { workspace = true }
dashmap = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
# LLM fallback (P3-T2): production HTTP transport for the LLM client. Kept behind
# the `LlmClient` trait so unit tests inject a fake and never touch the network.
reqwest = { workspace = true, features = ["json"] }
async-trait = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# SSE integration tests bind a real TCP server and read the streaming response
# incrementally (a `oneshot` would block on the never-ending stream body).
# `cookies` lets the P1-T6 server-wiring smoke tests carry the session/csrf
# cookies across requests automatically.
reqwest = { workspace = true, features = ["stream", "cookies"] }
futures-util = "0.3"
bytes = "1"
